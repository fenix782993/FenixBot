.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#0b0b0ff2;backdrop-filter:blur(22px);border-top:1px solid #2d2930}.navin{max-width:790px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{border:0;background:none;color:#89848d;border-radius:12px;padding:7px 2px;font-size:9px;font-weight:800;letter-spacing:.2px}.nav button span{display:block;font-size:18px;margin-bottom:3px}.nav button.active{color:#ff9b72;background:#2a1b19}

.primary{background:linear-gradient(105deg,var(--accent),color-mix(in srgb,var(--accent),white 18%));border-color:color-mix(in srgb,var(--accent),white 20%);box-shadow:0 8px 26px color-mix(in srgb,var(--accent),transparent 72%)}.logo{background:linear-gradient(145deg,color-mix(in srgb,var(--accent),white 22%),var(--accent),color-mix(in srgb,var(--accent),black 45%));box-shadow:0 8px 28px color-mix(in srgb,var(--accent),transparent 72%)}.eyebrow,.back{color:color-mix(in srgb,var(--accent),white 28%)}.nav button.active{color:color-mix(in srgb,var(--accent),white 30%);background:color-mix(in srgb,var(--accent),transparent 84%)}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 82%)}
.stat,.tile,.card{background:linear-gradient(145deg,color-mix(in srgb,var(--panel),white 3%),var(--panel));color:var(--text)}

<script>
(()=>{const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.("#080d18");tg?.setBackgroundColor?.("#070b13");const S={page:"home",data:null,cache:{},ticket:null};const app=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fmt=n=>Number(n||0).toLocaleString("ru-RU");function toast(s){document.querySelector(".toast")?.remove();let e=document.createElement("div");e.className="toast";e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2800)}async function api(p,m="GET",b){let r=await fetch("/api"+p,{method:m,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":tg?.initData||""},body:b?JSON.stringify(b):undefined});let j=await r.json();if(!j.ok)throw Error(j.error||"Ошибка запроса");return j.data}function nav(){return '<div class="nav"><div class="navin">'+[["home","⌂","Главная"],["profile","◉","Кабинет"],["media","▶","Медиа"],["support","✉","Поддержка"],["more","⋯","Ещё"]].map(([p,i,t])=>'<button class="'+(S.page===p?"active":"")+'" onclick="go(\''+p+'\')"><span>'+i+'</span>'+t+'</button>').join("")+'</div></div>'}function shell(c){app.innerHTML='<div class="wrap"><header class="top"><div class="brand"><div class="logo">🔥</div><div><b>FENIX ONLINE</b><small>ТВОЙ ПРОЕКТ. ТВОИ ВОЗМОЖНОСТИ.</small></div></div><button class="iconbtn" onclick="go(\'notifications\')">♢'+(S.data.stats.notifications?'<i class="dot"></i>':"")+'</button></header>'+c+'</div>'+nav()}function head(t,s){return '<button class="back" onclick="go(\'home\')">← На главную</button><div class="sectionhead"><h2>'+t+'</h2><span>'+(s||"")+'</span></div>'}function home(){let p=S.data.profile,x=S.data.stats;return '<section class="hero"><div class="eyebrow">ЛИЧНЫЙ ПРОФИЛЬ ИГРОКА</div><h1>Привет, '+esc(p.first_name||p.nick)+' 👋</h1><p>Добро пожаловать в экосистему FENIX ONLINE.</p><div class="herofoot"><span class="pill">🎮 '+esc(p.nick)+'</span><span class="pill">🟢 Аккаунт активен</span></div></section><div class="sectionhead"><h2>Твоя статистика</h2><span>сейчас</span></div><div class="grid">'+[['👥',x.referrals,'Приглашено игроков'],['🎫',x.open_tickets,'Активные обращения'],['🔔',x.notifications,'Новые уведомления'],['🏆',x.achievements,'Достижения']].map(a=>'<div class="stat"><div class="ico">'+a[0]+'</div><div class="num">'+fmt(a[1])+'</div><small>'+a[2]+'</small></div>').join("")+'</div><div class="sectionhead"><h2>Быстрый доступ</h2><span>все сервисы</span></div><div class="tiles">'+[['profile','👤','Личный кабинет','Профиль и настройки'],['referrals','🔗','Приглашения','Твоя ссылка'],['top','🏆','Рейтинг','Топ игроков'],['achievements','🎖️','Достижения','Твои награды'],['notifications','🔔','Уведомления','Центр событий'],['support','💬','Поддержка','Помощь администрации'],['shop','🚘','Магазин FENIX','Автомобили и тюнинг'],['wallet','💎','Кошелёк FNZ','Пополнение и история']].map(a=>'<button class="tile" onclick="go(\''+a[0]+'\')"><span class="ico">'+a[1]+'</span><b>'+a[2]+'</b><small>'+a[3]+'</small></button>').join("")+'</div>'}function profile(){let p=S.data.profile,x=S.data.stats;return head("Личный кабинет","АККАУНТ")+'<div class="card"><div class="row"><div><div class="muted tiny">ИГРОВОЙ НИКНЕЙМ</div><h2>'+esc(p.nick)+'</h2><div class="muted tiny">Telegram ID: '+p.id+'</div></div><span class="badge green">Активен</span></div></div><div class="grid"><div class="stat"><div class="num">'+x.referrals+'</div><small>Рефералы</small></div><div class="stat"><div class="num">'+x.channel_joins+'</div><small>Вступления по ссылке</small></div></div><div class="tiles" style="margin-top:12px">'+[['tickets','🎫','Мои обращения'],['notifications','🔔','Уведомления'],['achievements','🏆','Достижения'],['referrals','🔗','Реферальная система']].map(a=>'<button class="tile" onclick="go(\''+a[0]+'\')"><span class="ico">'+a[1]+'</span><b>'+a[2]+'</b></button>').join("")+'</div>'}function referrals(){let d=S.cache.stats||{};return head("Приглашен  head("Заявки медиапартнёров","ADMIN")+'<div class="card">'+(a.map(x=>'<div class="listitem"><b>#'+x.id+' · '+esc(x.nick||x.uid)+'</b><p>'+esc(x.ch)+'<br>'+esc(x.stats)+'<br>'+esc(x.contact)+'</p><button class="primary" onclick="decideApp('+x.id+',\'approved\')">Одобрить</button><button class="danger" onclick="decideApp('+x.id+',\'rejected\')">Отклонить</button></div>').join("")||'<div class="empty">Новых заявок нет</div>')+'</div>'}function adminPayoutsPage(){let a=S.cache.adminPayouts||[];return head("Заявки на выплаты","ADMIN")+'<div class="card">'+(a.map(x=>'<div class="listitem"><b>#'+x.id+' · '+esc(x.nick||x.uid)+'</b><p>'+esc(x.amount)+' · '+status(x.status)+'<br>Канал: '+esc(x.evidence?.channel_url)+'<br>Видео: '+esc(x.evidence?.video_url)+'<br>Реквизиты: '+esc(x.requisites)+'</p>'+(x.status==="pending"?'<input class="field" id="amt'+x.id+'" placeholder="Сумма, ₽"><input class="field" id="note'+x.id+'" placeholder="Комментарий"><button class="primary" onclick="decidePayout('+x.id+',\'approved\')">Одобрить</button><button class="danger" onclick="decidePayout('+x.id+',\'rejected\')">Отклонить</button>':x.status==="approved"?'<button class="primary" onclick="decidePayout('+x.id+',\'paid\')">Отметить выплату</button>':"")+'</div>').join("")||'<div class="empty">Заявок нет</div>')+'</div>'}function publish(){return head("Публикация в канал","ADMIN")+'<div class="card"><label class="label">ТЕКСТ</label><textarea id="pubtext" class="field" placeholder="Текст публикации…"></textarea><input id="publabel" class="field" placeholder="Текст URL-кнопки (необязательно)"><input id="puburl" class="field" placeholder="https://…"><button class="primary" onclick="doPublish()">Опубликовать</button></div>'}function broadcast(){return head("Рассылка игрокам","ADMIN")+'<div class="card"><textarea id="btext" class="field" placeholder="Сообщение всем пользователям…"></textarea><button class="primary" onclick="doBroadcast()">Запустить рассылку</button><p class="tiny muted">Рассылка выполняется в фоне.</p></div>'}function applyTheme(t){if(!t)return;let r=document.documentElement.style;r.setProperty("--accent",t.accent||"#f06a3d");r.setProperty("--blue",t.accent||"#f06a3d");r.setProperty("--bg",t.background||"#08090c");r.setProperty("--panel",t.panel||"#17191f");r.setProperty("--text",t.text||"#f5f3ef");r.setProperty("--muted",t.muted||"#92949d");document.body.style.backgroundColor=t.background||"#08090c"}function adminSettings(){let d=S.cache.design||{},t=d.theme||{},labels=d.labels||{},styles=d.button_styles||{},icons=d.button_icons||{},pack=d.emoji_pack||[],buttons=d.buttons||[];let color=(id,v)=>'<label class="label">'+id.toUpperCase()+'</label><input class="field" style="height:48px;padding:5px" type="color" id="theme_'+id+'" value="'+esc(v||"#f06a3d")+'">';let labelFields=[["cab_label","Личный кабинет"],["ref_label","Реферальная ссылка"],["stats_label","Статистика"],["top_label","Рейтинг"],["media_label","Медиапартнёрство"],["owner_label","Панель владельца"],["home_label","Новости"]];return head("Дизайн и тексты","НАСТРОЙКИ ПРОЕКТА")+'<div class="hero"><div class="eyebrow">FENIX CONTROL CENTER</div><h1>Твой стиль. Твои правила.</h1><p>Изменения сохраняются в базе и применяются к новым сообщениям и открытиям Mini App.</p></div><div class="card"><div class="sectionhead"><h2>Цветовая система</h2><span>MINI APP</span></div>'+color("accent",t.accent)+color("background",t.background)+color("panel",t.panel)+color("text",t.text)+color("muted",t.muted)+'</div><div class="card"><div class="sectionhead"><h2>Названия кнопок</h2><span>TELEGRAM BOT</span></div>'+labelFields.map(([k,n])=>'<label class="label">'+n.toUpperCase()+'</label><input class="field" data-label="'+k+'" maxlength="64" value="'+esc(labels[k]||"")+'">').join("")+'</div><div class="card"><div class="sectionhead"><h2>Тексты бота</h2><span>ОБЫЧНЫЙ ТЕКСТ</span></div><label class="label">ПРИВЕТСТВИЕ ЗАРЕГИСТРИРОВАННОГО ИГРОКА</label><textarea class="field" id="welcome_text">'+esc(d.welcome_text||"")+'</textarea><label class="label">ТЕКСТ РЕГИСТРАЦИИ</label><textarea class="field" id="registration_text">'+esc(d.registration_text||"")+'</textarea></div><div class="card"><div class="sectionhead"><h2>Цвета и Premium Emoji</h2><span>BOT API 9.4+</span></div><p class="tiny muted">Сначала импортируй набор командой /emojipack в чате с ботом. Затем назначь значок и цвет каждой кнопке.</p>'+buttons.map((label,i)=>'<div class="listitem"><b>'+esc(label)+'</b><div class="grid" style="margin-top:8px"><div><label class="label">ЦВЕТ КНОПКИ</label><select class="field" data-style="'+esc(label)+'"><option value="">По умолчанию</option>'+["primary","success","danger"].map(v=>'<option value="'+v+'" '+(styles[label]===v?"selected":"")+'>'+({primary:"Синий",success:"Зелёный",danger:"Красный"}[v])+'</option>').join("")+'</select></div><div><label class="label">PREMIUM EMOJI</label><select class="field" data-icon="'+esc(label)+'"><option value="">Без значка</option>'+pack.map((e,j)=>'<option value="'+esc(e.id)+'" '+(String(icons[label]||"")===String(e.id)?"selected":"")+'>'+esc(e.emoji||"💎")+' · №'+(j+1)+'</option>').join("")+'</select></div></div></div>').join("")+'</div><button class="primary" onclick="saveDesign()">Сохранить все изменения</button><button class="secondary" onclick="go(\'admin\')">Назад в панель управления</button>'}async function saveDesign(){try{let theme={};["accent","background","panel","text","muted"].forEach(k=>theme[k]=document.getElementById("theme_"+k).value);let labels={};document.querySelectorAll("[data-label]").forEach(e=>labels[e.dataset.label]=e.value);let button_styles={},button_icons={};document.querySelectorAll("[data-style]").forEach(e=>{if(e.value)button_styles[e.dataset.style]=e.value});document.querySelectorAll("[data-icon]").forEach(e=>{if(e.value)button_icons[e.dataset.icon]=e.value});let result=await api("/admin/design","POST",{theme,labels,button_styles,button_icons,welcome_text:document.getElementById("welcome_text").value,registration_text:document.getElementById("registration_text").value});applyTheme(result.theme);toast("Настройки FENIX ONLINE сохранены");await go("admin-settings")}catch(e){toast(e.message)}}function render(){let c=({home,profile,referrals,top:topPage,tickets,ticket,newticket:newTicket,support,notifications,achievements,media,more,admin,"admin-settings":adminSettings,"admin-tickets":adminTicketsPage,"admin-apps":adminAppsPage,"admin-payouts":adminPayoutsPage,"admin-store":adminStorePage,shop:shopPage,wallet:walletPage,plate:platePage,publish,broadcast})[S.page]?.()||home();shell(c)}async function go(p){S.page=p;render();try{if(p==="profile"){}if(p==="referrals")S.cache.stats=await api("/stats");if(p==="top")S.cache.top=await api("/top");if(p==="tickets")S.cache.tickets=await api("/tickets");if(p==="notifications"){S.cache.notifications=await api("/notifications");await api("/notifications/read","POST",{})}if(p==="achievements")S.cache.achievements=await api("/achievements");if(p==="media")S.cache.media=await api("/media");if(p==="admin")S.cache.admin=await api("/admin/overview");if(p==="admin-settings")S.cache.design=await api("/admin/design");if(p==="shop"||p==="wallet")S.cache.shop=await api("/shop");if(p==="admin-store")S.cache.adminStore=await api("/admin/store");render()}catch(e){toast(e.message)}}async function copyLink(){try{await navigator.clipboard.writeText(S.data.referral_link);toast("Ссылка скопирована")}catch(e){toast(S.data.referral_link)}}async function openTicket(id){try{S.cache.ticket=await api("/tickets/"+id);S.page="ticket";render()}catch(e){toast(e.message)}}async function createTicket(){try{await api("/tickets","POST",{subject:document.getElementById("subject").value,body:document.getElementById("body").value});toast("Обращение создано");await go("tickets")}catch(e){toast(e.message)}}async function reply(id){try{await api("/tickets/"+id+"/reply","POST",{body:document.getElementById("reply").value});await openTicket(id);toast("Ответ отправлен")}catch(e){toast(e.message)}}async function closeTicket(id){try{await api("/tickets/"+id+"/close","POST",{});await openTicket(id);toast("Обращение закрыто")}catch(e){toast(e.message)}}async function applyMedia(){try{await api("/media/apply","POST",{channel:document.getElementById("mchannel").value,audience:document.getElementById("maudience").value,contact:document.getElementById("mcontact").value});toast("Заявка отправлена");await go("media")}catch(e){toast(e.message)}}async function sendVideo(){try{await api("/media/video","POST",{url:document.getElementById("vurl").value});toast("Видеоотчёт отправлен");await go("media")}catch(e){toast(e.message)}}async function requestPayout(){try{await api("/media/payout","POST",{channel:document.getElementById("pchannel").value,video:document.getElementById("pvideo").value,requisites:document.getElementById("preq").value});toast("Заявка на выплату отправлена");await go("media")}catch(e){toast(e.message)}}async function adminTickets(){try{S.cache.adminTickets=await api("/admin/tickets");S.page="admin-tickets";render()}catch(e){toast(e.message)}}async function adminApps(){try{S.cache.adminApps=await api("/admin/media-applications");S.page="admin-apps";render()}catch(e){toast(e.message)}}async function adminPayouts(){try{S.cache.adminPayouts=await api("/admin/payouts");S.page="admin-payouts";render()}catch(e){toast(e.message)}}async function decideApp(id,d){try{await api("/admin/media-applications/"+id,"POST",{decision:d});toast("Решение сохранено");await adminApps()}catch(e){toast(e.message)}}async function decidePayout(id,d){try{await api("/admin/payouts/"+id,"POST",{decision:d,amount:document.getElementById("amt"+id)?.value,note:document.getElementById("note"+id)?.value});toast("Решение сохранено");await adminPayouts()}catch(e){toast(e.message)}}async function doPublish(){try{await api("/admin/publish","POST",{text:document.getElementById("pubtext").value,button_label:document.getElementById("publabel").value,button_url:document.getElementById("puburl").value});toast("Публикация отправлена");go("admin")}catch(e){toast(e.message)}}async function doBroadcast(){try{await api("/admin/broadcast","POST",{text:document.getElementById("btext").value});toast("Рассылка запущена");go("admin")}catch(e){toast(e.message)}}Object.assign(window,{go,copyLink,openTicket,createTicket,reply,closeTicket,applyMedia,sendVideo,requestPayout,adminTickets,adminApps,adminPayouts,decideApp,decidePayout,doPublish,doBroadcast,shopBuy,walletDonate,plateCalc,plateBuy,copyText,adminStoreLoad,adminStoreSave,adminDonation,adminOrder});(async()=>{try{S.data=await api("/bootstrap");applyTheme(S.data.theme);render()}catch(e){app.innerHTML='<div class="wrap"><div class="hero"><div class="eyebrow">FENIX ONLINE</div><h1>Не удалось открыть кабинет</h1><p>'+esc(e.message)+'</p></div><button class="primary" onclick="location.reload()">Повторить</button><p class="tiny muted">Сначала открой бота, отправь /start и заверши регистрацию.</p></div>'}})()})();
</script></body></html>
