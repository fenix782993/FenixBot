services:
  - type: web
    name: fenix-online-community-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    disk:
      name: fenix-online-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_URL
        value: https://t.me/+1usTps-EXmxjNWRl
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/fenix.sqlite3
