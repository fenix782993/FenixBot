<style>

ustify-content:space-between;align-items:center;margin:22px 2px 11px}.sectionhead h2{font-size:16px;margin:0}.sectionhead span{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.tile,.card{background:linear-gradient(145deg,#142136,#0e1725);border:1px solid var(--line);border-radius:var(--r)}.stat{padding:14px}.stat .num{font-size:23px;font-weight:850}.stat small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.stat .ico{font-size:17px;margin-bottom:8px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:15px;text-align:left;min-height:108px}.tile:active,.primary:active{transform:scale(.985)}.tile .ico{font-size:22px;display:block;margin-bottom:9px}.tile b{font-size:13px;display:block}.tile small{font-size:11px;color:var(--muted)}.card{padding:16px;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.tiny{font-size:11px}.badge{font-size:10px;padding:5px 8px;border-radius:20px;background:#1b3554;color:#91c8ff;white-space:nowrap}.green{background:#123a32;color:#6ce8b8}.gold{background:#42351e;color:#ffda92}.red{background:#432331;color:#ffa0b1}.primary,.secondary,.danger{border:0;border-radius:14px;padding:13px 15px;font-weight:750;width:100%;margin-top:10px;background:linear-gradient(100deg,#287bfa,#36b8ff);box-shadow:0 8px 24px #287bfa22}.secondary{background:#18283e;border:1px solid #304866;box-shadow:none}.danger{background:#482331;border:1px solid #703044;box-shadow:none;color:#ff9eae}.field{width:100%;background:#0a1220;border:1px solid #2b3e59;border-radius:13px;color:var(--text);padding:13px;margin:7px 0 11px;outline:none}.field:focus{border-color:var(--blue)}textarea.field{min-height:100px;resize:vertical}.label{font-size:11px;color:#b2c0d4;font-weight:750}.listitem{padding:13px 0;border-bottom:1px solid #203047}.listitem:last-child{border:0}.listitem b{font-size:13px}.listitem p{font-size:12px;color:var(--muted);margin:5px 0 0;overflow-wrap:anywhere}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#080e19ed;backdrop-filter:blur(20px);border-top:1px solid #26364c}.navin{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:none;color:#8292a9;border-radius:13px;padding:7px 2px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav button.active{color:#83c1ff;background:#142944}.back{border:0;background:none;color:#91bfff;padding:4px 0 12px;font-weight:700}.progress{height:8px;background:#1e2b40;border-radius:20px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#287bfa,#58d7ff);border-radius:20px}.toast{position:fixed;z-index:20;left:16px;right:16px;bottom:95px;padding:13px 16px;background:#1a2b42;border:1px solid #3d5e84;border-radius:14px;box-shadow:0 12px 40px #0008;text-align:center;font-size:13px}.loader{text-align:center;padding:55px 15px;color:var(--muted)}.spinner{width:25px;height:25px;border:2px solid #30415a;border-top-color:#4ba8ff;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:29px}}

<script>
(()=>{const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.("#080d18");tg?.setBackgroundColor?.("#070b13");const S={page:"home",data:null,cache:{},ticket:null};const app=document.getElementById("app");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const fmt=n=>Number(n||0).toLocaleString("ru-RU");function toast(s){document.querySelector(".toast")?.remove();let e=document.createElement("div");e.className="toast";e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),2800)}async function api(p,m="GET",b){let r=await fetch("/api"+p,{method:m,headers:{"Content-Type":"application/json","X-Telegram-Init-Data":tg?.initData||""},body:b?JSON.stringify(b):undefined});let j=await r.json();if(!j.ok)throw Error(j.error||"Ошибка запроса");return j.data}function nav(){return '<div class="nav"><div class="navin">'+[["home","⌂","Главная"],["profile","◉","Кабинет"],["media","▶","Медиа"],["support","✉","Поддержка"],["more","⋯","Ещё"]].map(([p,i,t])=>'<button class="'+(S.page===p?"active":"")+'" onclick="go(\''+p+'\')"><span>'+i+'</span>'+t+'</button>').join("")+'</div></div>'}function shell(c){app.innerHTML='<div class="wrap"><header class="top"><div class="brand"><div class="logo">🔥</div><div><b>FENIX ONLINE</b><small>ТВОЙ ПРОЕКТ. ТВОИ ВОЗМОЖНОСТИ.</small></div></div><button class="iconbtn" onclick="go(\'notifications\')">♢'+(S.data.stats.notifications?'<i class="dot"></i>':"")+'</button></header>'+c+'</div>'+nav()}function head(t,s){return '<button class="back" onclick="go(\'home\')">← На главную</button><div class="sectionhead"><h2>'+t+'</h2><span>'+(s||"")+'</span></div>'}function home(){let p=S.data.profile,x=S.data.stats;return '<section class="hero"><div class="eyebrow">ЛИЧНЫЙ ПРОФИЛЬ ИГРОКА</div><h1>Привет, '+esc(p.first_name||p.nick)+' 👋</h1><p>Добро пожаловать в экосистему FENIX ONLINE.</p><div class="herofoot"><span class="pill">🎮 '+esc(p.nick)+'</span><span class="pill">🟢 Аккаунт активен</span></div></section><div class="sectionhead"><h2>Твоя статистика</h2><span>сейчас</span></div><div class="grid">'+[['👥',x.referrals,'Приглашено игроков'],['🎫',x.open_tickets,'Активные обращения'],['🔔',x.notifications,'Новые уведомления'],['🏆',x.achievements,'Достижения']].map(a=>'<div class="stat"><div class="ico">'+a[0]+'</div><div class="num">'+fmt(a[1])+'</div><small>'+a[2]+'</small></div>').join("")+'</div><div class="sectionhead"><h2>Быстрый доступ</h2><span>все сервисы</span></div><div class="tiles">'+[['profile','👤','Личный кабинет','Профиль и настройки'],['referrals','🔗','Приглашения','Твоя ссылка'],['top','🏆','Рейтинг','Топ игроков'],['achievements','🎖️','Достижения','Твои награды'],['notifications','🔔','Уведомления','Центр событий'],['support','💬','Поддержка','Помощь администрации']].map(a=>'<button class="tile" onclick="go(\''+a[0]+'\')"><span class="ico">'+a[1]+'</span><b>'+a[2]+'</b><small>'+a[3]+'</small></button>').join("")+'</div>'}function profile(){let p=S.data.profile,x=S.data.stats;return head("Личный кабинет","АККАУНТ")+'<div class="card"><div class="row"><div><div class="muted tiny">ИГРОВОЙ НИКНЕЙМ</div><h2>'+esc(p.nick)+'</h2><div class="muted tiny">Telegram ID: '+p.id+'</div></div><span class="badge green">Активен</span></div></div><div class="grid"><div class="stat"><div class="num">'+x.referrals+'</div><small>Рефералы</small></div><div class="stat"><div class="num">'+x.channel_joins+'</div><small>Вступления по ссылке</small></div></div><div class="tiles" style="margin-top:12px">'+[['tickets','🎫','Мои обращения'],['notifications','🔔','Уведомления'],['achievements','🏆','Достижения'],['referrals','🔗','Реферальная система']].map(a=>'<button class="tile" onclick="go(\''+a[0]+'\')"><span class="ico">'+a[1]+'</span><b>'+a[2]+'</b></button>').join("")+'</div>'}function referrals(){let d=S.cache.stats||{};return head("Приглашения","РЕФЕРАЛЬНАЯ СИСТЕМА")+'<div class="hero"><div class="eyebrow">ТВОЯ ССЫЛКА</div><h1 style="font-size:18px;overflow-wrap:anywhere">'+esc(S.data.referral_link)+'</h1><p>Приглашай игроков в FENIX ONLINE.</p><button class="primary" onclick="copyLink()">Скопировать ссылку</button></div><div class="grid"><div class="stat"><div class="num">'+fmt(d.referrals)+'</div><small>Регистраций</small></div><div class="stat"><div class="num">'+fmt(d.channel_joins)+'</div><small>Вступлений в канал</small></div></div>'}function topPage(){let a=S.cache.top||[];return head("Рейтинг игроков","ТОП РЕФЕРАЛОВ")+'<div class="card">'+(a.length?a.map((x,i)=>'<div class="listitem row"><b>'+(i+1)+'. '+esc(x.nick)+'</b><span class="badge">'+fmt(x.n)+' 👥</span></div>').join(""):'<div class="empty">Рейтинг пока пуст</div>')+'</div>'}function tickets(){let a=S.cache.tickets||[];return head("Мои обращения","ПОДДЕРЖКА")+'<button class="primary" onclick="go(\'newticket\')">＋ Создать обращение</button><div class="card">'+(a.length?a.map(t=>'<div class="listitem row"><div><b>#'+t.id+' · '+esc(t.subject)+'</b><p>'+esc(t.created||"")+'</p></div><button class="badge" onclick="openTicket('+t.id+')">'+status(t.status)+'</button></div>').join(""):'<div class="empty">🎫<br>Обращений пока нет</div>')+'</div>'}function status(s){return ({open:"Открыта",answered:"Есть ответ",closed:"Закрыта",pending:"На проверке",approved:"Одобрено",paid:"Выплачено",rejected:"Отклонено"})[s]||s}function ticket(){let d=S.cache.ticket;if(!d)return head("Обращение");return head("Обращение #"+d.ticket.id,status(d.ticket.status))+'<div class="card"><b>'+esc(d.ticket.subject)+'</b>'+d.messages.map(m=>'<div class="listitem"><div class="row"><b>'+(m.sender===S.data.profile.id?"Ты":"Поддержка")+'</b><span class="tiny muted">'+esc(m.created||"")+'</span></div><p style="color:#d5e1f2">'+esc(m.body)+'</p></div>').join("")+'</div>'+(d.ticket.status!=="closed"?'<div class="card"><textarea id="reply" class="field" placeholder="Напиши сообщение…"></textarea><button class="primary" onclick="reply('+d.ticket.id+')">Отправить ответ</button><button class="danger" onclick="closeTicket('+d.ticket.id+')">Закрыть обращение</button></div>':"")}function newTicket(){return head("Новое обращение","СЛУЖБА ПОДДЕРЖКИ")+'<div class="card"><label class="label">ТЕМА</label><input id="subject" class="field" maxlength="100" placeholder="Например, проблема с аккаунтом"><label class="label">СООБЩЕНИЕ</label><textarea id="body" class="field" maxlength="4000" placeholder="Опиши ситуацию…"></textarea><button class="primary" onclick="createTicket()">Отправить обращение</button></div>'}function support(){return head("Поддержка","FENIX SUPPORT")+'<div class="hero"><div class="eyebrow">МЫ НА СВЯЗИ</div><h1>Нужна помощь?</h1><p>Создай обращение — администрация ответит здесь.</p></div><button class="primary" onclick="go(\'newticket\')">＋ Создать обращение</button><button class="secondary" onclick="go(\'tickets\')">🎫 Мои обращения</button>'}function notifications(){let a=S.cache.notifications||[];return head("Уведомления","ЦЕНТР СОБЫТИЙ")+'<div class="card">'+(a.length?a.map(n=>'<div class="listitem"><div class="row"><b>'+esc(n.title)+'</b><span class="badge '+(!n.is_read?"gold":"")+'">'+(!n.is_read?"Новое":"Прочитано")+'</span></div><p>'+esc(n.body)+'</p><p class="tiny">'+esc(n.created||"")+'</p></div>').join(""):'<div class="empty">🔔<br>Пока нет уведомлений</div>')+'</div>'}function achievements(){let a=S.cache.achievements||[];return head("Достижения","ТВОИ НАГРАДЫ")+'<div class="card">'+(a.length?a.map(x=>'<div class="listitem row"><b>🏅 '+esc(x.title)+'</b><span class="badge gold">Получено</span></div>').join(""):'<div class="empty">🏆<br>Награды появятся здесь по мере активности</div>')+'</div>'}function media(){let d=S.cache.media||{},s=d.status||"none";if(s==="none"||s==="rejected")return head("Медиапартнёрство","FENIX MEDIA")+'<div class="hero"><div class="eyebrow">FENIX CREATOR PROGRAM</div><h1>Стань медиапартнёром</h1><p>Публикуй контент о проекте, выполняй условия и получай выплаты.</p></div><div class="card"><label class="label">ССЫЛКА НА КАНАЛ</label><input id="mchannel" class="field" placeholder="https://…"><label class="label">АУДИТОРИЯ И СРЕДНИЕ ПРОСМОТРЫ</label><textarea id="maudience" class="field" placeholder="Подписчики, средние просмотры…"></textarea><label class="label">КОНТАКТ</label><input id="mcontact" class="field" placeholder="@username или ссылка"><button class="primary" onclick="applyMedia()">Отправить заявку</button></div>';if(s==="pending")return head("Медиапартнёрство")+'<div class="card empty">⏳<br><b>Заявка на рассмотрении</b><p>Решение придёт уведомлением.</p></div>';let days=d.active_days||0;return head("Кабинет медиапартнёра","FENIX MEDIA")+'<div class="hero"><div class="eyebrow">СТАТУС ПАРТНЁРА</div><h1>Ты в команде FENIX 🎬</h1><p>Публикации, просмотры и выплаты — в одном месте.</p><div class="herofoot"><span class="pill">🟢 Одобрен</span><span class="pill">👁 '+fmt(d.total_views)+' просмотров</span></div></div><div class="card"><div class="row"><b>Активность для выплаты</b><span class="badge">'+days+'/7 дней</span></div><div class="progress"><i style="width:'+(days/7*100)+'%"></i></div><p class="tiny muted">Для выплаты требуется 7 подтверждённых активных дней. Между заявками — 14 дней.</p></div><div class="card"><b>Видеоотчёт</b><input id="vurl" class="field" placeholder="Ссылка на опубликованное видео"><button class="primary" onclick="sendVideo()">Отправить отчёт</button></div><div class="card"><b>История выплат</b>'+((d.payouts||[]).map(p=>'<div class="listitem row"><b>#'+p.id+' · '+esc(p.amount||"Сумма не назначена")+'</b><span class="badge">'+status(p.status)+'</span></div>').join("")||'<p class="muted tiny">Заявок пока нет</p>')+'</div><div class="card"><b>Запросить выплату</b><p class="tiny muted">1 000 подтверждённых просмотров = 50 ₽.</p><input id="pchannel" class="field" placeholder="Ссылка на канал"><input id="pvideo" class="field" placeholder="Ссылка на видео"><textarea id="preq" class="field" placeholder="Реквизиты для выплаты"></textarea><button class="primary" onclick="requestPayout()">Подать заявку</button></div>'}function more(){return head("Ещё","РАЗДЕЛЫ")+'<div class="tiles"><button class="tile" onclick="go(\'top\')">🏆<b>Рейтинг</b></button><button class="tile" onclick="go(\'achievements\')">🎖️<b>Достижения</b></button><button class="tile" onclick="go(\'notifications\')">🔔<b>Уведомления</b></button>'+(S.data.admin?'<button class="tile" onclick="go(\'admin\')">⚙️<b>Админ-панель</b></button>':"")+'</div><div class="card"><span class="tiny muted">FENIX ONLINE · MINI APP</span><p class="tiny muted">Все сервисы проекта в одном приложении.</p></div>'}function admin(){let d=S.cache.admin||{};return head("Панель управления","ADMIN")+'<div class="grid">'+[['Игроков',d.users],['Рефералов',d.referrals],['Обращений',d.open_tickets],['Выплат на проверке',d.pending_payouts]].map(x=>'<div class="stat"><div class="num">'+fmt(x[1])+'</div><small>'+x[0]+'</small></div>').join("")+'</div><div class="tiles" style="margin-top:12px"><button class="tile" onclick="adminTickets()">🎫<b>Обращения</b></button><button class="tile" onclick="adminApps()">🤝<b>Заявки медиа</b></button><button class="tile" onclick="adminPayouts()">💸<b>Выплаты</b></button><button class="tile" onclick="go(\'publish\')">📢<b>Публикация</b></button><button class="tile" onclick="go(\'broadcast\')">📨<b>Рассылка</b></button></div>'}function adminTicketsPage(){let a=S.cache.adminTickets||[];return head("Обращения игроков","ADMIN")+'<div class="card">'+(a.map(t=>'<div class="listitem"><b>#'+t.id+' · '+esc(t.nick||t.uid)+'</b><p>'+esc(t.subject)+'</p><button class="secondary" onclick="openTicket('+t.id+')">Открыть</button></div>').join("")||'<div class="empty">Открытых обращений нет</div>')+'</div>'}function adminAppsPage(){let a=S.cache.adminApps||[];return head("Заявки медиапартнёров","ADMIN")+'<div class="card">'+(a.map(x=>'<div class="listitem"><b>#'+x.id+' · '+esc(x.nick||x.uid)+'</b><p>'+esc(x.ch)+'<br>'+esc(x.stats)+'<br>'+esc(x.contact)+'</p><button class="pr dmin-apps":adminAppsPage,"admin-payouts":adminPayoutsPage,publish,broadcast})[S.page]?.()||home();shell(c)}async function go(p){S.page=p;render();try{if(p==="profile"){}if(p==="referrals")S.cache.stats=await api("/stats");if(p==="top")S.cache.top=await api("/top");if(p==="tickets")S.cache.tickets=await api("/tickets");if(p==="notifications"){S.cache.notifications=await api("/notifications");await api("/notifications/read","POST",{})}if(p==="achievements")S.cache.achievements=await api("/achievements");if(p==="media")S.cache.media=await api("/media");if(p==="admin")S.cache.admin=await api("/admin/overview");render()}catch(e){toast(e.message)}}async function copyLink(){try{await navigator.clipboard.writeText(S.data.referral_link);toast("Ссылка скопирована")}catch(e){toast(S.data.referral_link)}}async function openTicket(id){try{S.cache.ticket=await api("/tickets/"+id);S.page="ticket";render()}catch(e){toast(e.message)}}async function createTicket(){try{await api("/tickets","POST",{subject:document.getElementById("subject").value,body:document.getElementById("body").value});toast("Обращение создано");await go("tickets")}catch(e){toast(e.message)}}async function reply(id){try{await api("/tickets/"+id+"/reply","POST",{body:document.getElementById("reply").value});await openTicket(id);toast("Ответ отправлен")}catch(e){toast(e.message)}}async function closeTicket(id){try{await api("/tickets/"+id+"/close","POST",{});await openTicket(id);toast("Обращение закрыто")}catch(e){toast(e.message)}}async function applyMedia(){try{await api("/media/apply","POST",{channel:document.getElementById("mchannel").value,audience:document.getElementById("maudience").value,contact:document.getElementById("mcontact").value});toast("Заявка отправлена");await go("media")}catch(e){toast(e.message)}}async function sendVideo(){try{await api("/media/video","POST",{url:document.getElementById("vurl").value});toast("Видеоотчёт отправлен");await go("media")}catch(e){toast(e.message)}}async function requ
